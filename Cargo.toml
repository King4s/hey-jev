[package]
name = "hey-jev"
version = "0.1.0"
edition = "2021"
description = "Mac voice assistant, rewritten in Rust: Jev decides, a TTS provider speaks. Every provider, model, prompt, threshold and path comes from config."
license = "MIT"
repository = "https://github.com/King4s/hey-jev"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
base64 = "0.22"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }

[profile.release]
opt-level = 2
